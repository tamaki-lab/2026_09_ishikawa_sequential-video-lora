# Standalone ViT + Q/K/V LoRA verification on a fixed CIFAR-10 train subset.
# Entry point: python -m scripts.smoke.smoke_vit_lora_cifar10
# Independent of conf/config.yaml; main.py / main_pl.py defaults are unchanged.

model:
  checkpoint_id: google/vit-base-patch16-224

lora:
  enabled: true
  target_modules: [q, v]  # any non-empty subset of q, k, v
  rank: 8
  alpha: 8
  dropout: 0.0

data:
  name: CIFAR10
  root: ./downloaded_data
  download: false  # set true only when downloading CIFAR-10 is approved
  train_subset_size: 64

training:
  seed: 0
  batch_size: 16
  max_steps: 20
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0

logging:
  comet_enabled: false

hydra:
  job:
    chdir: false
  run:
    dir: log/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: log/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
    subdir: ${hydra.job.num}
