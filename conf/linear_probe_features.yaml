defaults:
  - activitynet: v1_3
  - source_selection: activitynet_full_v1
  - encoder: vit_base_patch16_224
  - sequential: default
  - moco: stage6b_v2
  - provenance: research_v1
  - linear_probe: lp_v1
  - tracking: default
  - _self_

runtime:
  dataset_root: ???
  manifest_id: ${linear_probe.id}
  condition: ???
  snapshot: null
  feature_id: null
  device: cuda
  output_root: log/linear_probe

logging:
  disable_comet: false
  progress_interval_videos: 100

hydra:
  job:
    chdir: false
  run:
    dir: log/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: log/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
    subdir: ${hydra.job.num}
