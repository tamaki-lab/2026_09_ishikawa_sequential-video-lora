name: stage6b_v2
protocol_version: activitynet-full-single-pass-streaming-moco/v2
protocol:
  stream_mode: strict_single
  key_transform: gbr_horizontal_flip
  negative_policy: all_past
projection_size: 128
queue_capacity: 4096
momentum: 0.999
temperature: 0.07
optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
intervals:
  resume_videos: 100
  snapshot_videos: 1000
  comet_metric_updates: 100
